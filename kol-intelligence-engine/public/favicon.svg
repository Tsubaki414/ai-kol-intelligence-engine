<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="30" fill="#0F1117" stroke="#1E2230" stroke-width="2"/>
  <!-- Edges (network graph links) -->
  <g stroke-linecap="round">
    <line x1="20" y1="22" x2="32" y2="32" stroke="#10B981" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="44" y1="22" x2="32" y2="32" stroke="#10B981" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="20" y1="44" x2="32" y2="32" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="44" y1="44" x2="32" y2="32" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.9"/>
    <line x1="20" y1="22" x2="20" y2="44" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2"/>
    <line x1="44" y1="22" x2="44" y2="44" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2"/>
  </g>
  <!-- Nodes -->
  <circle cx="32" cy="32" r="5" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5"/>
  <circle cx="20" cy="22" r="4" fill="#3B82F6"/>
  <circle cx="44" cy="22" r="4" fill="#3B82F6"/>
  <circle cx="20" cy="44" r="4" fill="#10B981"/>
  <circle cx="44" cy="44" r="4" fill="#10B981"/>
</svg>
